name: Build OpenM1 v0.6.7
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout OpenM1
        uses: actions/checkout@v4
      - name: Setup pinned SDK
        uses: actions/checkout@v4
        with:
          repository: MXCHIP/mico-os
          ref: 9b09de78164940ff3876d2053f8e7dd42ca2b8ba
          path: mico-os
      - name: Install build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y make perl curl python3 python3-lib2to3 python-is-python3 dash libncurses5 lib32gcc-s1 libc6-i386
      - name: Setup GCC 5.4.1
        run: bash scripts/bootstrap_build_env.sh
      - name: Build and verify OpenM1
        run: bash scripts/build_recovery.sh
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenM1-v0.6.7
          path: dist/
          if-no-files-found: error
